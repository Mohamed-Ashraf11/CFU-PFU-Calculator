<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFU / PFU Calculator</title>

<style>
body {
    font-family: Arial, sans-serif;
    padding: 15px;
    max-width: 500px;
    margin: auto;
    background: #f8f9fa;
}

h2 {
    text-align: center;
}

label {
    font-size: 14px;
    font-weight: bold;
}

input, button {
    margin-top: 5px;
    margin-bottom: 12px;
    padding: 12px;
    width: 100%;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ccc;
    box-sizing: border-box;
}

input:focus {
    outline: none;
    border-color: #2c7be5;
}

button {
    background-color: #2c7be5;
    color: white;
    border: none;
    font-size: 16px;
}

button:hover {
    background-color: #1a5fd0;
}

.result {
    margin-top: 20px;
    padding: 15px;
    background: white;
    border-radius: 10px;
    font-weight: bold;
    line-height: 1.8;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

#dilutionPreview {
    font-size: 16px;
    color: #666;
    margin-top: -8px;
    margin-bottom: 10px;
}

.footer {
    margin-top: 30px;
    text-align: center;
    font-size: 12px;
    color: gray;
}

@media (max-width: 480px) {
    body { padding: 10px; }
    input, button { font-size: 15px; padding: 10px; }
}
</style>
</head>

<body>

<h2>🧪 CFU / PFU Calculator</h2>



<label>Counts (comma separated)</label>
<input id="counts" placeholder="e.g. 25,28,30">

<label>Dilution (e.g. 1e-2 → 1 × 10<sup>-2</sup>)</label>
<input id="dilution" placeholder="e.g. 1e-2" oninput="updateDilutionPreview()">
<div id="dilutionPreview"></div>

<label>Volume plated (µL)</label>
<input id="volume" value="10">

<button onclick="calculate()">Calculate</button>

<div class="result" id="output"></div>

<div class="footer">
Developed by M. Ashraf | Food Hygienic Chemistry Lab | Kyushu University
</div>

<script>

// 🔹 scientific format with superscript
function formatScientific(num) {
    if (num === 0) return "0";

    let exponent = Math.floor(Math.log10(num));
    let mantissa = num / Math.pow(10, exponent);

    const superscriptMap = {
        "-": "⁻",
        "0": "⁰", "1": "¹", "2": "²", "3": "³",
        "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷",
        "8": "⁸", "9": "⁹"
    };

    let expStr = exponent.toString()
        .split("")
        .map(char => superscriptMap[char] || char)
        .join("");

    return mantissa.toFixed(2) + " × 10" + expStr;
}

// 🔹 live dilution preview
function updateDilutionPreview() {
    let val = parseFloat(document.getElementById("dilution").value);

    if (!isNaN(val) && val !== 0) {
        document.getElementById("dilutionPreview").innerHTML =
            "→ " + formatScientific(val);
    } else {
        document.getElementById("dilutionPreview").innerHTML = "";
    }
}

// 🔹 main calculation
function calculate() {

    let counts = document.getElementById("counts").value
        .split(",")
        .map(Number)
        .filter(x => !isNaN(x));

    let dilution = parseFloat(document.getElementById("dilution").value);
    let volume_ul = parseFloat(document.getElementById("volume").value);

    if (counts.length === 0 || isNaN(dilution)) {
        alert("Please enter valid counts and dilution.");
        return;
    }

    let volume_ml = volume_ul / 1000;

    let avg = counts.reduce((a,b)=>a+b,0) / counts.length;

    let sd = Math.sqrt(
        counts.map(x => Math.pow(x - avg, 2))
        .reduce((a,b)=>a+b,0) / (counts.length - 1)
    );

    let factor = 1 / (volume_ml * dilution);

    let cfu = avg * factor;
    let sd_cfu = sd * factor;
    let log = Math.log10(cfu);

    document.getElementById("output").innerHTML =
        `Average: ${avg.toFixed(2)}<br>
         CFU/mL: ${formatScientific(cfu)}<br>
         Log₁₀: ${log.toFixed(2)}<br>
         SD: ${formatScientific(sd_cfu)}`;
}

</script>

</body>
</html>
